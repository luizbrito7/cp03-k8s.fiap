apiVersion: v1
kind: Pod
metadata:
  name: pod-privilegiado
spec:
  hostNetwork: true
  hostPID: true
  containers:
    - name: root
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
        runAsUser: 0
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
