apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: store-prod
resources:
  - ../../base
  - namespace.yaml
  - limitrange.yaml
  - resourcequota.yaml
  - pdb.yaml
  - hpa.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml
  - priorityclass.yaml
  - prometheusrule.yaml
images:
  - name: store-api
    newTag: "1.3" # imagem local carregada no kind: tag versionada e nunca reutilizada
  - name: nginxinc/nginx-unprivileged
    digest: sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03 # 1.30-alpine
  - name: redis
    digest: sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541 # 7-alpine
# store-api fora da lista: quem manda nas replicas dela e o HPA (minReplicas: 3)
replicas:
  - name: store-front
    count: 3
  - name: store-worker
    count: 2
patches:
  - path: patch-store-api.yaml
  # sem spec.replicas: a contagem e do HPA (doc oficial: "Migrating Deployments ... to horizontal autoscaling")
  - target:
      kind: Deployment
      name: store-api
    patch: |-
      - op: remove
        path: /spec/replicas
  - path: patch-store-front.yaml
