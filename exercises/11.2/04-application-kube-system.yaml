apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fiap-store-intrusa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # apagar a Application apaga o que ela criou
spec:
  project: fiap-store
  source:
    # teste: destino fora da lista do AppProject
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/fiap/fiap-store-config.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
