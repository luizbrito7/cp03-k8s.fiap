apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fiap-store-qa
  namespace: argocd
spec:
  project: fiap-store-sem-ns
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/fiap/fiap-store-config.git
    targetRevision: main
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: store-qa
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
