# consome a senha do banco via secretKeyRef; o Secret NAO esta no Git
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-relatorio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-relatorio
  template:
    metadata:
      labels:
        app: store-relatorio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relatorio
          image: busybox:1.37
          command: ["sh", "-c", "echo conectado ao banco com senha de ${#DB_PASSWORD} caracteres; sleep 3600"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
