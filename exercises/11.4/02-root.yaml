# unico ponto de entrada: kubectl apply -f 02-root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fiap-store-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # o root cria AppProject e Applications no namespace argocd, fora do fiap-store
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/fiap/fiap-store-config.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
