# CI da store-api: testa, constroi, escaneia, publica e PROPOE o deploy por PR no repo de config.
# Nao ha KUBECONFIG nem kubectl aqui: quem aplica no cluster e o Argo CD, lendo o Git.
name: ci

on:
  push:
    branches: [main]

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/store-api
  TAG: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push no GHCR com o GITHUB_TOKEN
    steps:
      # actions fixadas por SHA do commit (tag e ponteiro movel; ver incidente do Trivy em 03/2026)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Testes
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      - name: Build
        run: docker build --build-arg APP_VERSION=$TAG -t $IMAGEM:$TAG .

      - name: Scan (porta de qualidade)
        # imagem oficial do Trivy com versao fixa, no lugar da trivy-action
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0 image --exit-code 1 --severity CRITICAL --ignore-unfixed $IMAGEM:$TAG

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: docker push $IMAGEM:$TAG

  promove-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clona o repo de config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/fiap-store-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }} # PAT escopo repo: o GITHUB_TOKEN nao cruza repositorios

      - name: Instala kustomize
        run: |
          curl -sLo k.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz
          tar xzf k.tgz kustomize && sudo mv kustomize /usr/local/bin/

      - name: Bump da tag em overlays/dev
        working-directory: overlays/dev
        run: kustomize edit set image store-api=$IMAGEM:$TAG

      - name: Abre o PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          branch: bump/store-api-${{ github.run_number }}
          title: "dev: store-api ${{ github.run_number }}"
          commit-message: "chore(dev): bump store-api to ${{ github.run_number }}"
          body: "Gerado pelo CI da store-api (run ${{ github.run_id }}). Testes e scan aprovados."
