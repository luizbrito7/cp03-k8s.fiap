apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api-canary
  namespace: store-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-api
      version: canary
  template:
    metadata:
      labels:
        app: store-api
        version: canary
    spec:
      containers:
        - name: store-api
          image: store-api:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
