apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-worker
  namespace: store-dev
spec:
  replicas: 0
  selector:
    matchLabels:
      app: store-worker
  template:
    metadata:
      labels:
        app: store-worker
    spec:
      containers:
        - name: store-worker
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo processando pedidos; sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
