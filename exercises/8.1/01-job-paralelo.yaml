apiVersion: batch/v1
kind: Job
metadata:
  name: processa-pedidos
  namespace: store-dev
spec:
  completions: 10
  parallelism: 3
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lote
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              echo "inicio $(hostname)"
              sleep $(( (RANDOM % 6) + 3 ))
              echo "LOTE OK $(hostname)"
