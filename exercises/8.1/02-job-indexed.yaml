apiVersion: batch/v1
kind: Job
metadata:
  name: processa-particoes
  namespace: store-dev
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: particao
          image: busybox:1.37
          command: ["sh", "-c", "echo PARTICAO $JOB_COMPLETION_INDEX processada por $(hostname)"]
