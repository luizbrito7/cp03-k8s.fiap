apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store-debug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-api
  template:
    metadata:
      labels:
        app: store-api
    spec:
      containers:
        - name: store-api
          image: store-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /pronto # erro: rota inexistente
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store-debug
spec:
  selector:
    app: store-api
  ports:
    - port: 80
      targetPort: http
