apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-sa
  namespace: store-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leitura-store
  namespace: store-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leitura-store-monitor
  namespace: store-dev
subjects:
  - kind: ServiceAccount
    name: monitor-sa
    namespace: store-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leitura-store
