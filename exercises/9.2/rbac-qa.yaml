# (b) leitura para o GRUPO fiap:qa (vem do O= do certificado), so em store-dev
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qa-view
  namespace: store-dev
subjects:
  - kind: Group
    name: fiap:qa
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
# (c) exec apenas em store-dev
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qa-exec
  namespace: store-dev
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qa-exec
  namespace: store-dev
subjects:
  - kind: Group
    name: fiap:qa
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qa-exec
