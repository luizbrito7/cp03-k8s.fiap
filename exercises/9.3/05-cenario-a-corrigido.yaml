apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cenario-a
  namespace: store-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cenario-a
  namespace: store-dev
subjects:
  - kind: User
    name: user.a
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cenario-a
