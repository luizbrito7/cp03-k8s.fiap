apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cenario-c
  namespace: store-prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cenario-c
  namespace: store-prod
subjects:
  - kind: User
    name: user.c
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cenario-c
